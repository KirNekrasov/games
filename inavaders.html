<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #0a0a1a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: 'Courier New', monospace;
        color: #fff;
    }
    #hud {
        width: 800px;
        display: flex;
        justify-content: space-between;
        padding: 10px 20px;
        font-size: 20px;
        font-weight: bold;
    }
    #score { color: #0ff; }
    #hiscore { color: #f0f; }
    #lives { color: #0f0; }
    canvas {
        border: 2px solid #333;
        background: #050510;
        display: block;
    }
    #message {
        position: absolute;
        text-align: center;
        font-size: 32px;
        display: none;
        text-shadow: 0 0 10px currentColor;
    }
    #controls {
        margin-top: 10px;
        color: #666;
        font-size: 14px;
    }
    .wrap { position: relative; }
</style>
</head>
<body>
    <div id="hud">
        <span id="score">SCORE: 0</span>
        <span id="lives">LIVES: ♥♥♥</span>
        <span id="hiscore">HI-SCORE: 0</span>
    </div>
    <div class="wrap">
        <canvas id="game" width="800" height="600"></canvas>
        <div id="message"></div>
    </div>
    <div id="controls">← → or A/D to move | SPACE to shoot | P to pause | R to restart</div>

<script>
(() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    const scoreEl = document.getElementById('score');
    const hiScoreEl = document.getElementById('hiscore');
    const livesEl = document.getElementById('lives');
    const msgEl = document.getElementById('message');

    // ---------- LocalStorage ----------
    const HS_KEY = 'spaceInvadersHighScore';
    let highScore = parseInt(localStorage.getItem(HS_KEY)) || 0;
    hiScoreEl.textContent = 'HI-SCORE: ' + highScore;

    function saveHighScore(score) {
        if (score > highScore) {
            highScore = score;
            localStorage.setItem(HS_KEY, highScore);
            hiScoreEl.textContent = 'HI-SCORE: ' + highScore;
            return true;
        }
        return false;
    }

    // ---------- Game State ----------
    let player, bullets, enemies, enemyBullets, particles, powerups;
    let score, lives, level, gameOver, paused, keys, lastShot, enemyDir, enemySpeed, enemyDropTimer;
    let animFrame;

    function reset() {
        player = { x: W / 2 - 20, y: H - 45, w: 40, h: 24, speed: 5, cooldown: 0 };
        bullets = [];
        enemyBullets = [];
        particles = [];
        powerups = [];
        score = 0;
        lives = 3;
        level = 1;
        gameOver = false;
        paused = false;
        keys = {};
        lastShot = 0;
        spawnWave();
        updateHUD();
        msgEl.style.display = 'none';
    }

    function spawnWave() {
        enemies = [];
        const rows = 4 + Math.min(level - 1, 3);
        const cols = 8;
        const ew = 32, eh = 22;
        const spacingX = 55, spacingY = 40;
        const totalW = cols * spacingX;
        const startX = (W - totalW) / 2 + 10;
        const startY = 60 + (level - 1) * 10;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                enemies.push({
                    x: startX + c * spacingX,
                    y: startY + r * spacingY,
                    w: ew, h: eh,
                    type: r < 2 ? 2 : (r < 4 ? 1 : 0), // top rows = more points
                    alive: true,
                    anim: Math.random() * Math.PI * 2
                });
            }
        }
        enemyDir = 1;
        enemySpeed = 0.6 + level * 0.25;
        enemyDropTimer = 0;
    }

    function updateHUD() {
        scoreEl.textContent = 'SCORE: ' + score;
        livesEl.textContent = 'LIVES: ' + '♥'.repeat(Math.max(0, lives));
    }

    // ---------- Particles ----------
    function explode(x, y, color, count = 15) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 3;
            particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 30 + Math.random() * 20,
                color
            });
        }
    }

    // ---------- Input ----------
    document.addEventListener('keydown', e => {
        if (['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
        keys[e.key.toLowerCase()] = true;
        if (e.key === ' ' && gameOver && !paused) restart();
        if (e.key.toLowerCase() === 'p' && !gameOver) paused = !paused;
        if (e.key.toLowerCase() === 'r') restart();
    });
    document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    function restart() {
        cancelAnimationFrame(animFrame);
        reset();
        loop();
    }

    // ---------- Collision ----------
    function hit(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x &&
               a.y < b.y + b.h && a.y + a.h > b.y;
    }

    // ---------- Update ----------
    function update() {
        if (paused || gameOver) return;

        // Player movement
        if ((keys['arrowleft'] || keys['a']) && player.x > 0) player.x -= player.speed;
        if ((keys['arrowright'] || keys['d']) && player.x < W - player.w) player.x += player.speed;
        player.x = Math.max(0, Math.min(W - player.w, player.x));

        // Shooting
        if (keys[' '] && Date.now() - lastShot > 300) {
            bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 12 });
            lastShot = Date.now();
        }

        // Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].y -= 10;
            if (bullets[i].y < 0) bullets.splice(i, 1);
        }

        // Enemies movement
        let minX = Infinity, maxX = -Infinity;
        for (const e of enemies) {
            if (!e.alive) continue;
            minX = Math.min(minX, e.x);
            maxX = Math.max(maxX, e.x + e.w);
        }

        if (enemies.some(e => e.alive)) {
            let move = enemyDir * enemySpeed;
            if ((enemyDir > 0 && maxX + move >= W - 5) || (enemyDir < 0 && minX + move <= 5)) {
                enemyDir *= -1;
                for (const e of enemies) if (e.alive) e.y += 15;
                // Speed up as they descend
                enemySpeed += 0.05;
            } else {
                for (const e of enemies) if (e.alive) e.x += move;
            }
            for (const e of enemies) if (e.alive) e.anim += 0.1;

            // Enemies reaching player line
            for (const e of enemies) {
                if (e.alive && e.y + e.h >= player.y) {
                    gameOver = true;
                    lives = 0;
                    updateHUD();
                    showGameOver();
                    return;
                }
            }
        }

        // Enemy shooting
        if (enemies.some(e => e.alive) && Math.random() < 0.008 + level * 0.003) {
            const alive = enemies.filter(e => e.alive);
            const shooter = alive[Math.floor(Math.random() * alive.length)];
            enemyBullets.push({ x: shooter.x + shooter.w / 2 - 2, y: shooter.y + shooter.h, w: 4, h: 10 });
        }

        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            enemyBullets[i].y += 5;
            if (enemyBullets[i].y > H) { enemyBullets.splice(i, 1); continue; }

            // Hit player
            if (hit(enemyBullets[i], player)) {
                enemyBullets.splice(i, 1);
                lives--;
                explode(player.x + player.w / 2, player.y + player.h / 2, '#0f0', 25);
                updateHUD();
                if (lives <= 0) {
                    gameOver = true;
                    showGameOver();
                    return;
                }
            }
        }

        // Player bullets vs enemies
        for (let i = bullets.length - 1; i >= 0; i--) {
            for (const e of enemies) {
                if (!e.alive) continue;
                if (hit(bullets[i], e)) {
                    e.alive = false;
                    bullets.splice(i, 1);
                    const points = (e.type + 1) * 10;
                    score += points;
                    explode(e.x + e.w / 2, e.y + e.h / 2, ['#f0f', '#0ff', '#ff0'][e.type], 12);
                    updateHUD();
                    break;
                }
            }
        }

        // Powerups
        for (let i = powerups.length - 1; i >= 0; i--) {
            const p = powerups[i];
            p.y += 2.5;
            if (p.y > H) { powerups.splice(i, 1); continue; }
            if (hit(p, player)) {
                if (p.kind === 'life' && lives < 5) lives++;
                else score += 50;
                powerups.splice(i, 1);
                updateHUD();
            }
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Wave cleared
        if (!enemies.some(e => e.alive)) {
            level++;
            spawnWave();
        }
    }

    // ---------- Draw ----------
    function draw() {
        ctx.clearRect(0, 0, W, H);

        // Stars
        ctx.fillStyle = '#222';
        for (let i = 0; i < 60; i++) {
            const x = (i * 137 + (animFrame * 0.2)) % W;
            const y = (i * 89) % H;
            ctx.fillRect(x, y, 1.5, 1.5);
        }

        // Player
        if (!gameOver) {
            ctx.fillStyle = '#0f0';
            ctx.fillRect(player.x, player.y + 8, player.w, 16);
            ctx.fillRect(player.x + 14, player.y, 12, 8);
            ctx.fillRect(player.x, player.y + 4, 6, 4);
            ctx.fillRect(player.x + player.w - 6, player.y + 4, 6, 4);
        }

        // Bullets
        ctx.fillStyle = '#fff';
        bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

        ctx.fillStyle = '#f44';
        enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

        // Enemies
        for (const e of enemies) {
            if (!e.alive) continue;
            const colors = ['#ff0', '#0ff', '#f0f'];
            ctx.fillStyle = colors[e.type];
            const bob = Math.sin(e.anim) * 2;
            const x = e.x, y = e.y + bob;
            // Simple invader shape
            ctx.fillRect(x + 4, y + 4, e.w - 8, e.h - 8);
            ctx.fillRect(x, y + 8, 4, 8);
            ctx.fillRect(x + e.w - 4, y + 8, 4, 8);
            ctx.fillRect(x + 6, y + e.h - 4, 6, 4);
            ctx.fillRect(x + e.w - 12, y + e.h - 4, 6, 4);
            // Eyes
            ctx.fillStyle = '#000';
            ctx.fillRect(x + 8, y + 8, 4, 4);
            ctx.fillRect(x + e.w - 12, y + 8, 4, 4);
        }

        // Powerups
        for (const p of powerups) {
            ctx.fillStyle = p.kind === 'life' ? '#f0f' : '#ff0';
            ctx.font = 'bold 16px Courier New';
            ctx.fillText(p.kind === 'life' ? '♥' : '+50', p.x, p.y);
        }

        // Particles
        for (const p of particles) {
            ctx.globalAlpha = p.life / 50;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 3, 3);
        }
        ctx.globalAlpha = 1;

        // Pause
        if (paused) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 40px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('PAUSED', W / 2, H / 2);
            ctx.textAlign = 'left';
        }
    }

    function showGameOver() {
        const isNew = saveHighScore(score);
        msgEl.innerHTML = `<span style="color:#f44">GAME OVER</span><br>
            <span style="font-size:20px;color:#fff">Final Score: ${score}</span><br>
            ${isNew ? '<span style="font-size:20px;color:#ff0">★ NEW HIGH SCORE! ★</span><br>' : ''}
            <span style="font-size:18px;color:#888">Press SPACE or R to restart</span>`;
        msgEl.style.color = '#fff';
        msgEl.style.display = 'block';
        msgEl.style.left = '0';
        msgEl.style.right = '0';
        msgEl.style.top = '50%';
        msgEl.style.transform = 'translateY(-50%)';
    }

    // ---------- Powerup drops ----------
    const origExplode = explode;
    function maybeDropPowerup(x, y) {
        if (Math.random() < 0.08) {
            powerups.push({
                x, y, w: 20, h: 20,
                kind: Math.random() < 0.4 ? 'life' : 'points'
            });
        }
    }

    // Wrap enemy death to drop powerups
    const origUpdate = update;

    // ---------- Loop ----------
    function loop() {
        update();
        draw();
        animFrame = requestAnimationFrame(loop);
    }

    // Patch: call maybeDropPowerup when enemy dies
    // (integrated into update via monkey-patch is messy; instead handle in update)
    // Simpler: override explode to also drop
    const _explode = explode;
    explode = function(x, y, color, count) {
        _explode(x, y, color, count);
        maybeDropPowerup(x, y);
    };

    reset();
    loop();
})();
</script>
</body>
</html>
