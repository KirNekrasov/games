<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ТИГР-БАБКА: ЗАЩИТА ОГОРОДА</title>
<style>
  body{background:#000;margin:0;text-align:center;padding:20px;font-family:monospace;color:#0f0}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;border:4px solid #f90;background:#0a0a05}
</style>
</head>
<body>
🐯 ТИГР-БАБКА: ЗАЩИТА ОГОРОДА 🐯
← → двигаться · SPACE — кидать пирожки · R — заново

<canvas id="g" width="320" height="240"></canvas>
<script>
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=320,H=240;

const SPR={
babka:[
'..111111..',
'.11111111.',
'1122112211',
'1122112211',
'..111111..',
'..1.11.1..',
'..111111..',
'.11111111.',
'..111111..',
'..1....1..'],
enemy:[
'..1111..',
'.111111.',
'11111111',
'1.1111.1',
'11111111',
'.1.11.1.',
'11.11.11',
'1..11..1']};

function sprite(n,px,py,s,c1,c2){
const r=SPR[n];
for(let y=0;y<r.length;y++)
for(let x=0;x<r[y].length;x++){
const c=r[y][x];
if(c=='1'){ctx.fillStyle=c1;ctx.fillRect(px+xs,py+ys,s,s);}
else if(c=='2'){ctx.fillStyle=c2;ctx.fillRect(px+xs,py+ys,s,s);}
}
}

const player={x:145,y:195,w:30,h:30,s:3,cd:0};
let pies=[],eb=[],enemies=[],jams=[],score=0,lives=3,over=false,dir=1,wave=1,stars=[],hs=0,flash=0,flashTxt='';

for(let i=0;i<60;i++)stars.push({x:Math.random(),y:Math.random()H});

function makeEnemies(){
enemies=[];
for(let r=0;r<3;r++)
for(let col=0;col<8;col++)
enemies.push({x:20+col36,y:30+r30,w:24,h:24});
}

function reset(){
player.x=145;pies=[];eb=[];jams=[];score=0;lives=3;over=false;dir=1;wave=1;
makeEnemies();
}
reset();

const keys={};
document.addEventListener('keydown',e=>{
keys[e.code]=true;
if(e.code=='KeyR')reset();
if(e.code=='Space')e.preventDefault();
});
document.addEventListener('keyup',e=>keys[e.code]=false);

let AC=null;
function beep(f,d){
try{
AC=ACnew (window.AudioContextwindow.webkitAudioContext)();
const o=AC.createOscillator(),g=AC.createGain();
o.frequency.value=f;o.type='square';
g.gain.setValueAtTime(0.04,AC.currentTime);
g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);
o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
}catch(e){}
}

let frame=0;
function loop(){
frame++;
ctx.fillStyle='#0a0a05';ctx.fillRect(0,0,W,H);

ctx.fillStyle='#332';
for(const s of stars){ctx.fillRect(s.x,s.y,1,1);s.y+=0.2;if(s.y>H)s.y=0;}

ctx.fillStyle='#1a1a0a';
ctx.fillRect(0,H-30,W,30);
ctx.fillStyle='#2a2a10';
for(let i=0;i<20;i++)ctx.fillRect(i17,(H-30)+((i7)%18),3,3);

if(!over){
if(keys.ArrowLeft)player.x-=player.s;
if(keys.ArrowRight)player.x+=player.s;
player.x=Math.max(0,Math.min(W-player.w,player.x));
player.cd--;
if(keys.Space&&player.cd<=0){
pies.push({x:player.x+13,y:player.y-6});
player.cd=13;
beep(880,0.07);
}

for(let i=pies.length-1;i>=0;i--){
pies[i].y-=6;
if(pies[i].y<0)pies.splice(i,1);
}

let edge=false;
const spd=0.6+wave*0.15;
for(const e of enemies){
e.x+=dir*spd;
if(e.x<=0||e.x+e.w>=W)edge=true;
}
if(edge){dir*=-1;for(const e of enemies)e.y+=10;}
if(frame%(Math.max(20,45-wave*4))==0&&enemies.length){
const e=enemies[Math.floor(Math.random()*enemies.length)];
eb.push({x:e.x+12,y:e.y+24});
beep(180,0.05);
}

for(let i=eb.length-1;i>=0;i--){
eb[i].y+=3;
if(eb[i].y>H)eb.splice(i,1);
}

for(let i=pies.length-1;i>=0;i--){
for(const e of enemies){
if(pies[i]&&pies[i].x>e.x&&pies[i].x<e.x+e.w&&pies[i].y>e.y&&pies[i].y<e.y+e.h){
e.alive=false;pies.splice(i,1);score+=10;beep(440,0.09);
if(Math.random()<0.12)jams.push({x:e.x+6,y:e.y,w:12,h:14});
break;
}
}
}
enemies=enemies.filter(e=>e.alive);
if(!enemies.length){
wave++;
score+=100+wave*50;
flash=90;flashTxt='WAVE '+wave+'! ВАРЕНЬЕ ВАРИТСЯ!';
makeEnemies();
beep(660,0.2);
}

for(const e of enemies){if(e.y>player.y-14)over=true;}

for(let i=eb.length-1;i>=0;i--){
if(eb[i].x>player.x&&eb[i].xplayer.y&&eb[i].y=0;i--){
jams[i].y+=1.5;
if(jams[i].y>H)jams.splice(i,1);
else if(jams[i].x>player.x-4&&jams[i].xplayer.y-4&&jams[i].y0){flash--;ctx.fillStyle='#fff';ctx.font='8px monospace';ctx.fillText(flashTxt,W/2-70,120);}

ctx.fillStyle='#ff9';
ctx.font='8px monospace';
ctx.fillText('SCORE '+score,4,10);
ctx.fillText('WAVE '+wave,120,10);
ctx.fillText('REC '+hs,200,10);
ctx.fillText('БАБКА x'+lives,260,10);

if(score>hs)hs=score;

if(over){
ctx.fillStyle='#fff';
ctx.font='16px monospace';
ctx.fillText('БАБКА УШЛА ЗА',W/2-80,H/2-10);
ctx.fillText('ВАРЕНЬЕМ...',W/2-70,H/2+8);
ctx.fillStyle='#ff9';
ctx.font='8px monospace';
ctx.fillText('PRESS R — БАБКА ВЕРНЁТСЯ',W/2-90,H/2+26);
}
requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
